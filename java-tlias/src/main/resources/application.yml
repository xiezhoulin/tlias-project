# 端口号 -默认8080
server:
  port: 8080

spring:
  application:
    name: tlias-web-management
    # MySql连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xxx # 本地数据库连接 -将xxx换成数据库名称
    username: # 数据库账号
    password: # 数据库密码
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true # 开启下划线转驼峰
  mapper-locations: classpath:mapper/*.xml  # 指定 XML 所在的目录路径

app:
  # 本地图片环境
  image-upload: #换成自己本地图片上传文件路径
  image-path: http://localhost:8080/xxx/ # 本地图片保存数据库路径
